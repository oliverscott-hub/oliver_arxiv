name: Publish weekly arXiv dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'library/*.coverage.json'
      - '.github/workflows/publish-weekly-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static dashboard and coverage data
        run: |
          mkdir -p _site/data
          cp dashboard/index.html _site/index.html
          cp library/*.coverage.json _site/data/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
