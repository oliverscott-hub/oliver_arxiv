name: Publish weekly arXiv dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'library/*.sqlite'
      - 'library/*.coverage.json'
      - 'abstract_evaluation/rubric_v3_qwen3_8b*.sqlite'
      - '.github/workflows/publish-weekly-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build weekday summaries from collector databases
        run: python scripts/build_weekday_dashboard.py

      - name: Assemble static dashboard and summary data
        run: |
          mkdir -p _site/data
          cp dashboard/index.html _site/index.html
          cp dashboard/data/weekday_totals.json _site/data/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
