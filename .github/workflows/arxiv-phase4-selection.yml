name: 4 Select arXiv papers scoring at least 9
on:
  schedule:
    - cron: '20 */2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [run-arxiv-phase4-selection]
permissions:
  contents: write
concurrency:
  group: arxiv-phase4-selection
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore collector libraries
        run: python scripts/library_storage.py restore
      - name: Build phase 4 SQLite
        run: python scripts/build_phase4_selection.py
      - name: Publish phase 4 SQLite
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add abstract_evaluation/phase4/selected_papers.sqlite
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update arXiv phase 4 selection'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
