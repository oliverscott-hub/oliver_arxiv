name: arXiv hep-ex collector

on:
  schedule:
    - cron: '30 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      max_days:
        description: "Máximo de días UTC a procesar en esta ejecución"
        required: true
        default: "30"
        type: string

permissions:
  contents: write

concurrency:
  group: arxiv-api-requests
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recopilar días pendientes de hep-ex
        env:
          MAX_DAYS: ${{ inputs.max_days || '30' }}
        run: python scripts/collect_arxiv_category.py --category hep-ex --max-days "$MAX_DAYS"
      - name: Guardar SQLite, cobertura y log
        if: always()
        run: |
          if [ ! -f library/hep-ex.sqlite ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add library/hep-ex.sqlite library/hep-ex.coverage.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar biblioteca arXiv hep-ex'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            echo 'No se pudieron publicar los datos tras tres intentos.' >&2
            exit 1
          fi
