name: arXiv PDF review DeepSeek-R1-Distill-Qwen-14B

on:
  schedule:
    - cron: '50 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      max_papers:
        description: 'Maximum papers to review (0 = unlimited)'
        required: false
        default: '0'
  repository_dispatch:
    types: [run-arxiv-pdf-review-deepseek-r1-14b]

permissions:
  contents: write

concurrency:
  group: arxiv-pdf-review-deepseek-r1-14b
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Set deadline
        run: echo "PDF_REVIEW_DEADLINE_EPOCH=$(date -u -d '+345 minutes' +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: deepseek-r1-14b-q4km-v1
      - name: Install inference and PDF dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'llama-cpp-python==0.3.36' --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -m pip install --disable-pip-version-check 'huggingface_hub==2.4.0' 'PyMuPDF==1.26.5'
      - name: Review PDFs
        env:
          PDF_REVIEW_MODEL: deepseek_r1_14b
          PDF_REVIEW_MAX_PAPERS: ${{ inputs.max_papers || '0' }}
        run: python -u scripts/review_arxiv_pdfs_v2.py
      - name: Save SQLite
        if: always()
        run: |
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then git rebase --abort; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add abstract_evaluation/v2/pdf_review_deepseek_r1_14b.sqlite
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save PDF reviews deepseek_r1_14b'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
