name: Actualizar metadatos de arXiv

on:
  schedule:
    - cron: '19 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arxiv-metadata-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar metadatos de arXiv
        run: python scripts/collect_arxiv.py

      - name: Guardar catálogo actualizado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/arxiv_records.json
          if git diff --cached --quiet; then
            echo 'El catálogo no ha cambiado.'
          else
            git commit -m 'Actualizar metadatos de arXiv'
            git push
          fi
