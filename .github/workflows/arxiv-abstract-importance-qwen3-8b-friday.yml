name: 1-5 Friday

on:
  schedule:
    - cron: '0 6,14,22 * * *'
  workflow_dispatch:
    inputs:
      max_papers:
        description: 'Máximo de papers para una prueba manual (0 = sin límite)'
        required: false
        default: '0'
  repository_dispatch:
    types: [run-arxiv-rubric-qwen3-8b-friday]

permissions:
  contents: write

concurrency:
  group: arxiv-abstract-importance-qwen3-8b-friday
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Configure Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # Reserve 15 minutes for closing and publishing the final SQLite and JSON.
      - name: Set evaluation deadline
        run: echo "IMPORTANCE_DEADLINE_EPOCH=$(date -u -d '+345 minutes' +%s)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore Hugging Face model cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: qwen3-8b-q4km-v1

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            'llama-cpp-python==0.3.36' \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -m pip install --disable-pip-version-check 'huggingface_hub==2.4.0'

      - name: Evaluate rubric v3 and record attempts
        env:
          IMPORTANCE_DEADLINE_EPOCH: ${{ env.IMPORTANCE_DEADLINE_EPOCH }}
          RUBRIC_MODEL: qwen3_8b
          RUBRIC_DAY_GROUP: friday
          RUBRIC_MAX_PAPERS: ${{ inputs.max_papers || '0' }}
        run: python -u scripts/run_rubric_v3.py

      - name: Save SQLite results
        if: always()
        run: |
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            git rebase --abort
          fi
          if [ ! -f abstract_evaluation/rubric_v3_qwen3_8b_friday.sqlite ]; then
            echo 'No se creó la base de valoraciones.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add abstract_evaluation/rubric_v3_qwen3_8b_friday.sqlite
          if git diff --cached --quiet; then
            echo 'No hay nuevas valoraciones que guardar.'
            exit 0
          fi
          git commit -m 'Guardar valoraciones de importancia de arXiv'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'No se pudo subir la base SQLite tras tres intentos.' >&2
          exit 1
