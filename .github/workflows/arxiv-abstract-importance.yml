name: arXiv abstract importance evaluator

on:
  schedule:
    # 02:00 UTC, then every eight hours.
    - cron: '0 2,10,18 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [run-importance-evaluation]

permissions:
  contents: write

concurrency:
  group: arxiv-abstract-importance
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      # Reserve 15 minutes for closing and publishing the final SQLite and JSON.
      - name: Set evaluation deadline
        run: echo "IMPORTANCE_DEADLINE_EPOCH=$(date -u -d '+345 minutes' +%s)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: qwen3-1.7b-q4km-dcb19155b962dbb6389f4691a982043a8e651022

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            'llama-cpp-python==0.3.36' \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -m pip install --disable-pip-version-check 'huggingface_hub==2.4.0'

      - name: Evaluate newest unscored papers, rotating categories and UTC days
        env:
          IMPORTANCE_DEADLINE_EPOCH: ${{ env.IMPORTANCE_DEADLINE_EPOCH }}
          IMPORTANCE_MODEL_VARIANT: mod0
        run: python -u scripts/evaluate_arxiv_importance.py

      - name: Save SQLite results
        if: always()
        run: |
          if [ ! -f abstract_evaluation/abstract_importance_mod0.sqlite ]; then
            echo 'No se creó la base de valoraciones.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add abstract_evaluation/abstract_importance_mod0.sqlite abstract_evaluation/priority_mod0.json
          if git diff --cached --quiet; then
            echo 'No hay nuevas valoraciones que guardar.'
            exit 0
          fi
          git commit -m 'Guardar valoraciones de importancia de arXiv'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'No se pudo subir la base SQLite tras tres intentos.' >&2
          exit 1
