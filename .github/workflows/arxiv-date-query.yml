name: Consultar rango de fechas de arXiv y guardar en SQLite

on:
  workflow_dispatch:
    inputs:
      from_day:
        description: "Primer día UTC incluido (YYYY-MM-DD)"
        required: true
        type: string
        default: "2026-10-01"
      to_day:
        description: "Último día UTC incluido (YYYY-MM-DD)"
        required: true
        type: string
        default: "2026-10-10"

permissions:
  contents: write

concurrency:
  group: arxiv-api-requests
  cancel-in-progress: false

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener la versión más reciente de main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar astro-ph.CO y guardar en SQLite
        env:
          FROM_DAY: ${{ inputs.from_day }}
          TO_DAY: ${{ inputs.to_day }}
        run: >-
          python scripts/query_arxiv_to_sqlite.py
          --from-day "$FROM_DAY"
          --to-day "$TO_DAY"

      - name: Guardar base SQLite en el repositorio
        if: always()
        run: |
          if [ ! -f data/arxiv_queries.sqlite ]; then
            echo 'No hay base SQLite para guardar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/arxiv_queries.sqlite
          if git diff --cached --quiet; then
            echo 'La base SQLite no ha cambiado.'
          else
            git commit -m 'Guardar consulta histórica de astro-ph.CO'
            git push
          fi
