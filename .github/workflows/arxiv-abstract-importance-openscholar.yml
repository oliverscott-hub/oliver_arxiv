name: arXiv abstract importance evaluator OpenScholar

on:
  push:
    branches: [main]
    paths:
      - abstract_evaluation/priority_mod1.json
  schedule:
    - cron: '0 2,10,18 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [run-importance-evaluation-openscholar]

permissions:
  contents: write

concurrency:
  group: arxiv-abstract-importance-openscholar
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Set evaluation deadline
        run: echo "IMPORTANCE_DEADLINE_EPOCH=$(date -u -d '+345 minutes' +%s)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore OpenScholar model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--QuantFactory--Llama-3.1_OpenScholar-8B-GGUF
          key: openscholar-8b-q4km-9cf91d74d4aa7756b98837a6b356a6588f503de1

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            'llama-cpp-python==0.3.36' \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -m pip install --disable-pip-version-check 'huggingface_hub==2.4.0'

      - name: Evaluate newest unscored papers with OpenScholar
        env:
          IMPORTANCE_DEADLINE_EPOCH: ${{ env.IMPORTANCE_DEADLINE_EPOCH }}
          IMPORTANCE_MODEL_VARIANT: mod1
        run: python -u scripts/evaluate_arxiv_importance.py

      - name: Save OpenScholar SQLite results
        if: always()
        run: |
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            git rebase --abort
          fi
          if [ ! -f abstract_evaluation/abstract_importance_mod1.sqlite ]; then
            echo 'No se creó la base de valoraciones de OpenScholar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add abstract_evaluation/abstract_importance_mod1.sqlite abstract_evaluation/priority_mod1.json
          if git diff --cached --quiet; then
            echo 'No hay nuevas valoraciones que guardar.'
            exit 0
          fi
          git commit -m 'Guardar valoraciones OpenScholar de arXiv'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'No se pudo subir la base OpenScholar tras tres intentos.' >&2
          exit 1
