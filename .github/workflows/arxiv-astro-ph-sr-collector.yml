name: 0 Solar and Stellar Astrophysics

on:
  schedule:
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      max_days:
        description: "Máximo de días UTC a procesar en esta ejecución"
        required: true
        default: "30"
        type: string

permissions:
  contents: write

concurrency:
  group: arxiv-api-requests
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restaurar bibliotecas
        run: python scripts/library_storage.py restore library/astro-ph_SR.sqlite library/astro-ph_SR.coverage.sqlite

      - name: Recopilar días pendientes de astro-ph.SR
        env:
          MAX_DAYS: ${{ inputs.max_days || '30' }}
        run: python scripts/collect_arxiv_category.py --category astro-ph.SR --max-days "$MAX_DAYS"
      - name: Guardar SQLite, cobertura y log
        if: always()
        run: |
          if [ ! -f library/astro-ph_SR.sqlite ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/library_storage.py pack library/astro-ph_SR.sqlite library/astro-ph_SR.coverage.sqlite
          git add library/astro-ph_SR.db library/astro-ph_SR.coverage.db
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar biblioteca arXiv astro-ph.SR'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            echo 'No se pudieron publicar los datos tras tres intentos.' >&2
            exit 1
          fi
