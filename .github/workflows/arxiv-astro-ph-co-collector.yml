name: 0 Cosmology and Nongalactic Astrophysics

on:
  schedule:
    # Every six hours at minute 30 UTC.
    - cron: '30 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      max_days:
        description: "Máximo de días UTC a procesar en esta ejecución"
        required: true
        default: "30"
        type: string

permissions:
  contents: write

concurrency:
  group: arxiv-api-requests
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obtener la versión más reciente de main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Recopilar días pendientes de astro-ph.CO
        env:
          MAX_DAYS: ${{ inputs.max_days || '30' }}
        run: python scripts/collect_arxiv_category.py --category astro-ph.CO --max-days "$MAX_DAYS"

      - name: Guardar SQLite, cobertura y log
        if: always()
        run: |
          if [ ! -f library/astro-ph_CO.sqlite ]; then
            echo 'No se creó la base de datos.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add library/astro-ph_CO.sqlite library/astro-ph_CO.coverage.json
          if git diff --cached --quiet; then
            echo 'No hay cambios que guardar.'
          else
            git commit -m 'Actualizar biblioteca arXiv astro-ph.CO'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            echo 'No se pudieron publicar los datos tras tres intentos.' >&2
            exit 1
          fi
