name: arXiv math-ph collector

on:
  schedule:
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      max_days:
        description: "Máximo de días UTC a procesar en esta ejecución"
        required: true
        default: "30"
        type: string

permissions:
  contents: write

concurrency:
  group: arxiv-api-requests
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recopilar días pendientes de math-ph
        env:
          MAX_DAYS: ${{ inputs.max_days || '30' }}
        run: python scripts/collect_arxiv_category.py --category math-ph --max-days "$MAX_DAYS"
      - name: Guardar SQLite, cobertura y log
        if: always()
        run: |
          if [ ! -f library/math-ph.sqlite ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add library/math-ph.sqlite library/math-ph.coverage.json logs/arxiv_collector.jsonl
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar biblioteca arXiv math-ph'
            git push
          fi
