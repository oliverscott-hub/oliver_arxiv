name: arXiv PDF review Qwen3-VL-8B

on:
  schedule:
    - cron: '20 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      max_papers:
        description: 'Maximum candidates (0 = unlimited)'
        required: false
        default: '0'
  repository_dispatch:
    types: [run-arxiv-pdf-review-qwen3-vl-8b]

permissions:
  contents: write

concurrency:
  group: arxiv-pdf-review-qwen3-vl-8b
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Set deadline
        run: echo "PDF_REVIEW_DEADLINE_EPOCH=$(date -u -d '+345 minutes' +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: pdf-review-qwen3_vl_8b-v1
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'llama-cpp-python==0.3.36' --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -m pip install --disable-pip-version-check 'huggingface_hub==2.4.0' 'PyMuPDF==1.26.5'
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build llama.cpp/build --config Release --target llama-server -j 4
      - name: Review PDF pages with vision
        env:
          PDF_REVIEW_MODEL: qwen3_vl_8b
          PDF_REVIEW_MAX_PAPERS: ${{ inputs.max_papers || '0' }}
        run: python -u scripts/review_arxiv_pdfs_vision.py
      - name: Save SQLite
        if: always()
        run: |
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then git rebase --abort; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add abstract_evaluation/pdf_review_qwen3_vl_8b.sqlite
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save PDF reviews qwen3_vl_8b'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
