name: 2-5 Friday

on:
  schedule:
    - cron: '20 1,7,13,19 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [run-arxiv-pdf-review-qwen3-rag-8b-friday]

permissions:
  contents: write

concurrency:
  group: arxiv-pdf-review-qwen3-rag-8b-friday
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Set deadline
        run: echo "PDF_REVIEW_DEADLINE_EPOCH=$(date -u -d '+345 minutes' +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore collector libraries
        run: python scripts/library_storage.py restore
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: qwen3-8b-q4km-v1
      - name: Install inference and PDF dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'llama-cpp-python==0.3.36' --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -m pip install --disable-pip-version-check 'huggingface_hub==2.4.0' 'PyMuPDF==1.26.5'
      - name: Review PDFs and record attempts
        env:
          PDF_REVIEW_MODEL: qwen3_rag_8b
          PDF_REVIEW_DAY_GROUP: friday
        run: python -u scripts/review_arxiv_pdfs_open.py
      - name: Save SQLite
        if: always()
        run: |
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then git rebase --abort; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add abstract_evaluation/open_answers_v1/pdf_answers_qwen3_rag_8b_friday.sqlite
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save open PDF answers qwen3_rag_8b'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
