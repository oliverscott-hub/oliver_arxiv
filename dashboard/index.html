<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>arXiv · Papers por día de la semana</title>
  <style>
    :root{color-scheme:light;--ink:#182230;--muted:#64748b;--line:#e2e8f0;--accent:#2563eb;--panel:#fff;--bg:#f4f7fb}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(1100px,100%);margin:auto;padding:24px 16px 48px}h1{margin:0 0 4px;font-size:clamp(1.45rem,5vw,2rem);letter-spacing:-.03em}.sub{margin:0;color:var(--muted);font-size:.92rem}
    nav{display:flex;gap:8px;overflow-x:auto;padding:18px 0 12px;-webkit-overflow-scrolling:touch}nav button{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#fff;color:#334155;padding:9px 14px;font:inherit;cursor:pointer}nav button[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:white}button:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
    .summary{display:flex;align-items:center;gap:14px;margin:8px 0 16px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.total{font-size:clamp(1.8rem,7vw,2.7rem);font-weight:750;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.summary-label{color:#475569}
    .charts{display:grid;grid-template-columns:1fr;gap:14px}.panel{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:16px;box-shadow:0 4px 18px #0f172a08}.panel h2{margin:0;font-size:1.12rem}.note{margin:3px 0 10px;color:var(--muted);font-size:.85rem}.chart-wrap{overflow-x:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}svg{display:block;width:100%;height:260px;min-width:310px}.axis{stroke:#cbd5e1;stroke-width:1}.grid{stroke:#edf1f6;stroke-width:1}.bar{fill:#3b82f6}.bar:hover{fill:#1d4ed8}.axis-text{fill:#64748b;font-size:11px}.bar-count{fill:#334155;font-size:11px;font-weight:650}.meta,.state{margin:12px 2px 0;color:var(--muted);font-size:.82rem}.state{padding:24px 4px;font-size:.95rem}
    @media(min-width:760px){.charts{grid-template-columns:1fr 1fr}.panel:last-child{grid-column:1/-1}.panel:last-child svg{height:300px}}
    @media(max-width:560px){main{padding:20px 12px 36px}.panel{padding:13px}.summary{padding:12px 15px}.panel:last-child svg{height:250px}}
  </style>
</head>
<body>
  <main>
    <header><h1>Papers de arXiv por día de la semana</h1><p class="sub">Fecha UTC efectiva: <code>updated</code>, y <code>published</code> cuando <code>updated</code> falta</p></header>
    <nav id="categories" aria-label="Seleccionar categoría"></nav>
    <section class="summary" aria-live="polite"><div class="total" id="total">—</div><div class="summary-label"><strong id="category-name">Cargando…</strong><br>papers únicos recolectados</div></section>
    <div id="state" class="state">Cargando datos de los colectores…</div>
    <div id="charts" class="charts" hidden>
      <section class="panel"><h2>Semana actual</h2><p class="note" id="current-range"></p><div class="chart-wrap"><svg id="current-chart" role="img" aria-label="Papers por día en la semana UTC actual"></svg></div></section>
      <section class="panel"><h2>Semana pasada</h2><p class="note" id="previous-range"></p><div class="chart-wrap"><svg id="previous-chart" role="img" aria-label="Papers por día en la semana UTC anterior"></svg></div></section>
      <section class="panel"><h2>Total histórico</h2><p class="note">Todos los registros, agrupados por el día UTC de su fecha efectiva</p><div class="chart-wrap"><svg id="all-chart" role="img" aria-label="Papers históricos por día de la semana UTC"></svg></div></section>
    </div>
    <p id="updated" class="meta"></p>
  </main>
  <script>
    const fmt=new Intl.NumberFormat('es-ES');let data;let selected='Total';
    const nav=document.querySelector('#categories');
    function draw(id,values){
      const svg=document.querySelector(`#${id}`),ns='http://www.w3.org/2000/svg',W=640,H=260,left=48,right=14,top=24,bottom=42,plotH=H-top-bottom;
      svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
      const max=Math.max(1,...values),step=Math.max(1,Math.ceil(max/4)),ceiling=step*4;
      for(let i=0;i<=4;i++){const value=ceiling*i/4,y=top+plotH-(value/ceiling)*plotH,line=document.createElementNS(ns,'line');line.setAttribute('x1',left);line.setAttribute('x2',W-right);line.setAttribute('y1',y);line.setAttribute('y2',y);line.setAttribute('class',i===0?'axis':'grid');svg.append(line);const label=document.createElementNS(ns,'text');label.setAttribute('x',left-8);label.setAttribute('y',y+4);label.setAttribute('text-anchor','end');label.setAttribute('class','axis-text');label.textContent=fmt.format(value);svg.append(label)}
      values.forEach((v,i)=>{const slot=(W-left-right)/7,bw=Math.min(48,slot*.58),x=left+i*slot+(slot-bw)/2,h=(v/ceiling)*plotH,y=top+plotH-h,bar=document.createElementNS(ns,'rect');bar.setAttribute('x',x);bar.setAttribute('y',y);bar.setAttribute('width',bw);bar.setAttribute('height',Math.max(h,1));bar.setAttribute('rx',5);bar.setAttribute('class','bar');const title=document.createElementNS(ns,'title');title.textContent=`${data.weekdays[i]}: ${fmt.format(v)} papers`;bar.append(title);svg.append(bar);const count=document.createElementNS(ns,'text');count.setAttribute('x',x+bw/2);count.setAttribute('y',Math.max(top+12,y-6));count.setAttribute('text-anchor','middle');count.setAttribute('class','bar-count');count.textContent=fmt.format(v);svg.append(count);const day=document.createElementNS(ns,'text');day.setAttribute('x',left+i*slot+slot/2);day.setAttribute('y',H-14);day.setAttribute('text-anchor','middle');day.setAttribute('class','axis-text');day.textContent=data.weekdays[i].slice(0,3);svg.append(day)});
    }
    function render(){const d=data.categories[selected];document.querySelector('#category-name').textContent=selected;document.querySelector('#total').textContent=fmt.format(d.total);draw('current-chart',d.current_week);draw('previous-chart',d.previous_week);draw('all-chart',d.all_time)}
    function makeTabs(){for(const name of ['Total',...Object.keys(data.categories).filter(x=>x!=='Total')]){const b=document.createElement('button');b.type='button';b.textContent=name;b.setAttribute('aria-pressed',String(name===selected));b.addEventListener('click',()=>{selected=name;for(const el of nav.children)el.setAttribute('aria-pressed',String(el.textContent===selected));render()});nav.append(b)}}
    async function load(){try{const r=await fetch('data/weekday_totals.json',{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);data=await r.json();makeTabs();const dateFmt=new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'short',timeZone:'UTC'}),add=(iso,days)=>{const d=new Date(`${iso}T00:00:00Z`);d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10)};document.querySelector('#current-range').textContent=`${dateFmt.format(new Date(data.week_start_utc+'T00:00:00Z'))} – ${dateFmt.format(new Date(add(data.week_start_utc,6)+'T00:00:00Z'))} UTC (acumulado hasta hoy)`;document.querySelector('#previous-range').textContent=`${dateFmt.format(new Date(data.previous_week_start_utc+'T00:00:00Z'))} – ${dateFmt.format(new Date(data.previous_week_end_utc+'T00:00:00Z'))} UTC`;document.querySelector('#state').hidden=true;document.querySelector('#charts').hidden=false;document.querySelector('#updated').textContent=`Datos generados ${new Date(data.generated_at_utc).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short',timeZone:'UTC'})} UTC. La vista Total cuenta cada arXiv_id una vez.`;render()}catch(e){document.querySelector('#state').textContent='No se pudieron cargar los datos. Se actualizarán al publicarse una nueva versión del dashboard.'}}
    load();
  </script>
</body>
</html>
